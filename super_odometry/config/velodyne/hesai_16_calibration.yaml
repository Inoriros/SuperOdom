%YAML:1.0

# Rotation from laser frame to imu frame, imu^R_laser
# Since they are aligned, this is the Identity Matrix
extrinsicRotation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [1., 0., 0.,
         0., 1., 0.,
         0., 0., 1.]

# Translation from laser frame to imu frame, imu^T_laser
# This is the position of the Lidar relative to the IMU
extrinsicTranslation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [-0.193, 0.0, 0.313]

# Manual rotation offset for fine-tuning (usually left at 0)
imu_laser_rotation_offset: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [0.0, 0.0, 0.0]

# Used for some SLAM variants to adjust for high-speed turns
yaw_ratio: 0.0